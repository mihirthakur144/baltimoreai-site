name = "baltimoreai-legal-demo"
main = "src/worker-legal.js"
compatibility_date = "2025-01-15"

# ─── Layer 1: Per-IP rate limit ────────────────────────────────
# 8 requests per 60 seconds per IP. namespace_id is an arbitrary integer,
# distinct from the main demo worker's (must be unique per binding).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

# ─── Layer 2: Daily global cap (KV-backed counter) ─────────────
# KV namespace "DEMO_LIMITS_legal" already created (via the Cloudflare
# connector) and its id is filled in below. What's left, from inside the
# worker/ directory:
#
#   wrangler secret put ANTHROPIC_API_KEY --config wrangler-legal.toml
#   wrangler deploy --config wrangler-legal.toml
#
[[kv_namespaces]]
binding = "DEMO_LIMITS"
id = "21c7640acca04a7e8fb5649bbf0091d4"
